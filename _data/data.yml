career-profile:
  title: Career Profile
  summary: |
    Experienced software developer with over 10 years of hands-on expertise in designing, building, and supporting enterprise systems and high-load microservice architectures.

    Skilled in .NET / .NET Core, ASP.NET (MVC and Blazor), **Python** (Flask, microservices, tooling), **Redis**, and integration of distributed systems using gRPC, REST APIs, RabbitMQ, and Elasticsearch.

    Proven track record in developing solutions for the **financial** and **advertising** industries, including large-scale data pipelines, customer behavior analytics, and integration with various external systems.

    Confident in DevOps practices with Docker, Jenkins, OpenShift, and GitHub Actions, as well as CI/CD automation and secure service delivery.

    Strong problem-solving skills, architectural thinking, and ability to deliver production-ready software in fast-paced, cross-functional environments.

