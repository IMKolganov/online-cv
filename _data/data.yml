experiences:
  title: Experiences
  info:
    - role: Senior Software Developer
      time: Apr 2025 – Mar 2026
      company: ISX Financial EU Plc
      details: |
        Worked on backend development for a **financial payment platform** used for processing transactions and integrations with external financial institutions.

        Implemented integration with the **UK Post Office payment system**, including processing settlement files, barcode-based payments, and automated reconciliation pipelines.

        Designed and developed services for **processing high-volume financial data**, parsing structured files (CSV / XML), validating transactions, and storing results in relational databases.

        Developed internal tooling for **barcode generation and payment reference processing**, used in payment terminals and customer payment flows.

        Implemented secure **SFTP-based file exchange** with external partners and built automation tools for downloading, validating, and importing financial settlement files.

        Worked extensively with **C#**, **Python** (Flask, microservices, tooling), **Redis**, **ASP.NET**, **SQL Server**, and **high-load backend services**, focusing on reliability, data consistency, and auditability of financial transactions.
    - role: Software Developer
      time: Jan 2024 – Apr 2025
      company: Elly Analytics
      details: |
        Developed and maintained analytics platforms focused on processing **large-scale advertising data** and analyzing **customer behavior** across multiple client companies.

        Built internal infrastructure tools using **Blazor** for secure access to company systems, and implemented a **security architecture** based on **.NET 6**.

        Supported and extended microservices communicating via **message queues**, integrated with external advertising platforms such as **Google Ads**, **Facebook Ads**, and **Yandex Direct**.

        Designed and optimized data flows into **Elasticsearch** for fast, flexible querying and visualization of advertising and user behavior metrics. Also contributed to **Python** (Flask) microservices and used **Redis** for caching and session state across the platform.
    - role: Software Developer
      time: Jul 2022 – May 2024
      company: Gamyfy Ltd
      details: |
        Developed backend services for a gaming platform using **C#**, **ASP.NET Core**, **SignalR**, **gRPC**, and **Entity Framework Core**.

        Implemented API Gateway functionality via **Ocelot**, handled real-time communication scenarios, and contributed to scalable system architecture.

        Applied **MediatR** for implementing the CQRS pattern, enabling decoupled request/response handling across services.

        Integrated **Elasticsearch** for indexing gameplay events, user activity, and system logs to support monitoring, search, and analytics.

        Automated build and deployment pipelines using **GitHub Actions**, with **Docker-based** delivery of microservices for consistency across development and production environments. Developed and maintained **Python** (Flask) microservices alongside C# services; used **Redis** for caching, pub/sub, and real-time data.
    - role: Head Development Engineer
      time: May 2019 – Jul 2022
      company: Non-state Pension Fund of Sberbank
      details: |
        Led development of backend services and system integrations in a high-load banking environment.

        Played a key role in designing and implementing **.NET Core 3.1 microservices** and **Python** (Flask) microservices for **Sber Online**, deployed in **OpenShift** containers.

        Developed integrations with internal systems, including:
        - **Diasoft CRM** (Delphi-based, MSSQL)
        - **IBM FileNet** (document management system)

        Maintained and extended legacy systems built with **Delphi**, as well as applications using **WPF**, **MSSQL**, and **MySQL**.

        Designed and maintained **Jenkins pipelines** for CI/CD, automating the build and deployment of all microservices to OpenShift clusters.

        Worked in an Agile environment using **Jira** and **Confluence** for planning and documentation.
    - role: Developer
      time: Mar 2016 – May 2019
      company: Academic Gymnasium at Cambridge
      details: |
        Developed and maintained internal CRM and warehouse management systems using **Delphi (VCL + Firebird)** and **C# (.NET Framework with ASP.NET MVC + Razor)**, with **MS SQL Server** as the backend database.

        Built Razor-based web interfaces, implemented business logic, and integrated with relational databases.

        Worked across both legacy desktop tools and modern web platforms to support school operations and resource management.
    - role: Programmer / System Administrator
      time: Nov 2015 – Dec 2016
      company: Vash Razmer
      details: |
        Focused primarily on software development using **Delphi**, **VCL**, **DevExpress**, and **MS SQL Server** to support and automate business operations.

        Developed POS (point-of-sale) interfaces for cashiers, internal accounting tools, and SMS notification modules integrated with customer and sales data.

        Also performed system administration tasks to support the development environment and ensure infrastructure stability.
    - role: Developer
      time: Apr 2013 – Dec 2014
      company: Svyaz Engineering
      details: |
        Worked in a small team developing desktop applications using Delphi and the VCL framework to automate internal workflows and integrate with 1C:Enterprise.

        Developed a tool for automatic printing of large-format drawings (A1–A3), triggered by data from 1C.

        Created an accounting automation utility that processed and synchronized data from 1C.

        Analyzed routine tasks and implemented custom solutions to improve process efficiency.



